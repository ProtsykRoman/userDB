<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout}">
<head>
<title layout:fragment="title">Бази даних</title>
<link rel="stylesheet" th:href="@{/css/lists.css}">
<link rel="icon" type="image/png" th:href="@{/favicon.png}">
</head>
<body>
	<div layout:fragment="content" class="list-container">

		<div class="list-header">
			<h2>Список баз даних</h2>
			<a class="btn-add" th:href="@{/databases/new}">+ Додати
				нову</a>
		</div>

		<table class="list-table">
			<thead>
				<tr>
					<th>ID</th>
					<th>Назва</th>
					<th>Активний</th>
					<th>Дії</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="database : ${databases}">
					<td th:text="${database.id}"></td>
					<td th:text="${database.name}"></td>
					<td th:text="${database.isActive} ? 'Так' : 'Ні'"></td>
					<td class="table-actions"><a
						th:href="@{'/databases/edit/' + ${database.id}}" class="btn-edit">Редагувати</a>
					</td>
				</tr>
			</tbody>
		</table>
		<div class="pagination"
			th:with="
        start=${totalRecords == 0 ? 0 : ((currentPage - 1) * pageSize + 1)},
        end=${T(java.lang.Math).min(currentPage * pageSize, totalRecords)}">

			<span
				th:text="${'Записи ' + start + ' - ' + end + ' з ' + totalRecords}"></span>

			<div class="pagination-buttons">

				<!-- На початок -->
				<a th:if="${currentPage > 1}"
					th:href="@{/databases(page=1, size=${pageSize})}">
					&laquo;&laquo; Початок </a>

				<!-- Назад -->
				<a th:if="${currentPage > 1}"
					th:href="@{/databases(page=${currentPage - 1}, size=${pageSize})}">
					&laquo; Назад </a>

				<!-- Вперед -->
				<a th:if="${currentPage < totalPages}"
					th:href="@{/databases(page=${currentPage + 1}, size=${pageSize})}">
					Вперед &raquo; </a>

				<!-- В кінець -->
				<a th:if="${currentPage < totalPages}"
					th:href="@{/databases(page=${totalPages}, size=${pageSize})}">
					Кінець &raquo;&raquo; </a>

			</div>
		</div>


	</div>
</body>
</html>
