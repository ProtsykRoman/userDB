<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout}">
<head>
<title layout:fragment="title">Головна</title>
<link rel="icon" type="image/png" th:href="@{/favicon.png}">
</head>
<body>
	<div layout:fragment="content" style="padding: 10px 30px;">
    <!-- Напис максимально зверху -->
    <h1 style="margin: 0 0 16px 0; 
               color: #2c3e50; 
               font-weight: 600; 
               font-size: 2rem;
               text-align: left;">
        Вітаємо в системі!
    </h1>

    <!-- Контейнер для картинки без підрізання -->
    <div class="welcome-image-wrapper" style="width: 100%; max-width: 1400px;">
        <img th:src="@{/images/welcome.jpg}" 
             style="width: 100%; 
                    height: auto; 
                    display: block;
                    border-radius: 12px; 
                    box-shadow: 0 4px 20px rgba(0,0,0,0.08);">
    </div>
</div>


</body>
</html>
