<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title layout:fragment="title" th:text="${user.id == 0} ? 'Створити користувача' : 'Редагувати користувача'"></title>
    <link rel="stylesheet" th:href="@{/css/user-form.css}">
</head>
<body>
    <div layout:fragment="content" class="form-container">
        <h2 th:text="${user.id == 0} ? 'Створити користувача' : 'Редагувати користувача'"></h2>

        <div th:if="${error}" class="form-error">
            <p th:text="${error}"></p>
        </div>

        <form th:object="${user}" 
              th:action="${user.id == 0} ? @{/users} : @{'/users/update/' + ${user.id}}" 
              method="post" id="userForm">
            
            <input type="hidden" id="id" th:field="*{id}" />

            <label for="username">Логін:</label>
            <input type="text" id="username" th:field="*{username}" required />

            <!-- Роль користувача -->
            <label for="role">Роль у системі:</label>
            <select id="role" th:field="*{role}" required>
                <option value="">-- Виберіть роль --</option>
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
            </select>

            <!-- Створення нового -->
            <div th:if="${user.id == 0}">
                <label for="password">Пароль:</label>
                <input type="password" id="password" th:field="*{password}" required />
                
                <label for="confirmPassword">Підтвердження пароля:</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required />
            </div>

            <!-- Редагування існуючого -->
            <div th:if="${user.id != 0}">
                <div class="checkbox-inline">
                    <input type="checkbox" id="changePassword" th:field="*{changePassword}" />
                    <label for="changePassword" style="display:inline; margin:0;">Змінити пароль</label>
                </div>

                <div id="passwordFields" style="display: none;">
                    <label for="oldPassword">Старий пароль:</label>
                    <input type="password" id="oldPassword" th:field="*{oldPassword}" />
                    
                    <label for="newPassword">Новий пароль:</label>
                    <input type="password" id="newPassword" th:field="*{newPassword}" />
                    
                    <label for="confirmPasswordEdit">Підтвердження нового пароля:</label>
                    <input type="password" id="confirmPasswordEdit" name="confirmPassword" />
                </div>
            </div>

            <label for="department">Департамент:</label>
            <select id="department" th:field="*{department.id}">
                <option value="0">--- Виберіть департамент ---</option>
                <option th:each="dept : ${allDepartments}" th:value="${dept.id}"
                        th:text="${'--'.repeat(dept.level) + dept.name}"></option>
            </select>

            <!-- Статус активності -->
            <div class="checkbox-inline">
                <input type="checkbox" id="isActive" th:field="*{isActive}" />
                <label for="isActive" style="display:inline; margin:0;">Активний</label>
            </div>

            <div class="form-buttons">
                <button type="submit" class="btn-add">Зберегти</button>
                <a th:href="@{/users}" class="btn-cancel">Скасувати</a>
            </div>
        </form>
    </div>

    <th:block layout:fragment="scripts">
        <script th:src="@{/js/user-form.js}"></script>
    </th:block>
</body>
</html>
