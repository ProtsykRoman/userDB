<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title layout:fragment="title">Звіти</title>
    <link rel="stylesheet" th:href="@{/css/form-userDB.css}">
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
</head>
<body>
<div layout:fragment="content" class="form-container">

    <h2>Формування звітів</h2>

    <form th:action="@{/reports}" method="get">

        <!-- Рядок фільтрів -->
        <div class="form-row">

            <div class="form-group">
                <label for="database">База даних:</label>
                <select id="database" name="databaseId">
                    <option value="">-- Всі бази --</option>
                    <option th:each="db : ${databases}" th:value="${db.id}" th:text="${db.name}"
                        th:selected="${param.databaseId == db.id}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="role">Роль:</label>
                <select id="role" name="roleId">
                    <option value="">-- Всі ролі --</option>
                    <option th:each="r : ${databaseRoles}" th:value="${r.id}" th:text="${r.name + ' (' + r.database.name + ')'}"
                        th:selected="${param.roleId == r.id}"></option>
                </select>
            </div>

            <div class="form-group">
                <label for="certificate">Сертифікат:</label>
                <select id="certificate" name="certificateTypeId">
                    <option value="">-- Всі сертифікати --</option>
                    <option th:each="c : ${certificateTypes}" th:value="${c.id}" th:text="${c.name}"
                        th:selected="${param.certificateTypeId == c.id}"></option>
                </select>
            </div>

        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="expFrom">Закінчення від:</label>
                <input type="date" id="expFrom" name="expFrom" th:value="${param.expFrom}" />
            </div>

            <div class="form-group">
                <label for="expTo">Закінчення до:</label>
                <input type="date" id="expTo" name="expTo" th:value="${param.expTo}" />
            </div>

            <div class="form-group">
                <label for="department">Підрозділ:</label>
                <select id="department" name="departmentId">
                    <option value="">-- Всі підрозділи --</option>
                    <option th:each="dept : ${allDepartments}" th:value="${dept.id}"
                        th:text="${'--'.repeat(dept.level) + dept.name}"
                        th:selected="${param.departmentId == dept.id}"></option>
                </select>
            </div>
        </div>

        <div class="form-buttons">
            <button type="submit" class="btn-add">Показати</button>
            <a th:href="@{/reports}" class="btn-cancel">Очистити</a>
        </div>
    </form>

    <!-- Таблиця результатів -->
    <div th:if="${users != null}">
        <h3>Результати</h3>
        <table class="list-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>ПІБ</th>
                    <th>Звання</th>
                    <th>Підрозділ</th>
                    <th>Ідентифікаційний</th>
                    <th>Активний</th>
                    <th>Сертифікати</th>
                    <th>Бази / Ролі</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.name}"></td>
                    <td th:text="${user.rank?.name}"></td>
                    <td th:text="${user.department != null ? '--'.repeat(user.department.level) + user.department.name : ''}"></td>
                    <td th:text="${user.identificationNumber}"></td>
                    <td th:text="${user.isActive} ? 'Так' : 'Ні'"></td>
                    <td>
                        <span th:each="c : ${user.dbUserCertificates}" th:text="${c.certificateType?.name} + ' (' + c.expirationDate + ')'" style="display:block;"></span>
                    </td>
                    <td>
                        <span th:each="a : ${user.dbUserAccesses}" th:text="${a.database?.name + ' / ' + a.databaseRole?.name}" style="display:block;"></span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
