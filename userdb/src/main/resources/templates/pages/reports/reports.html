<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz"
      layout:decorate="~{layout}">
<head>
    <title layout:fragment="title">Звіти</title>
    <link rel="stylesheet" th:href="@{/css/reports.css}">
    <style>
        /* Стиль для заблокованих полів (сірий колір та заборона кліку) */
        select:disabled {
            background-color: #e0e0e0 !important;
            color: #666 !important;
            cursor: not-allowed;
            opacity: 0.7;
        }
    </style>
</head>

<body>
<div layout:fragment="content" class="form-container">
    <h2>Формування звітів</h2>

    <form th:action="@{/reports}" method="get" id="reportForm">

        <!-- Перший рядок -->
        <div class="form-row">
            <div class="form-group">
                <label>Область пошуку</label>
                <select name="onlyDepartmentSelected" id="onlyDepartmentSelected">
                    <option value="true" th:selected="${onlyDepartmentSelected == true}">Тільки вибраний</option>
                    <option value="false" th:selected="${onlyDepartmentSelected == false}">Підпорядковані</option>
                </select>
            </div>

            <div class="form-group">
                <label>Підрозділ</label>
                <select name="departmentId" id="departmentId">
                    <option value="">-- всі --</option>
                    <option th:each="d : ${departments}" th:value="${d.id}"
                            th:text="${'--'.repeat(d.level) + d.name}"
                            th:selected="${departmentId == d.id}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Закінчення до</label>
                <input type="date" name="expirationTo" id="expirationTo" th:value="${param.expirationTo}">
            </div>
        </div>

        <!-- Другий рядок (Взаємовиключні фільтри) -->
        <div class="form-row">
            <div class="form-group">
                <label>Тип сертифікату</label>
                <select id="certificateTypeId" name="certificateTypeId">
                    <option value="">-- всі --</option>
                    <option th:each="c : ${certificateTypes}" th:value="${c.id}"
                            th:text="${c.name}" th:selected="${certificateTypeId == c.id}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>База даних</label>
                <select id="databaseId" name="databaseId">
                    <option value="">-- всі --</option>
                    <option th:each="db : ${databases}" th:value="${db.id}"
                            th:text="${db.name}" th:selected="${databaseId == db.id}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Роль</label>
                <select id="databaseRoleId" name="databaseRoleId">
                    <option value="">-- всі --</option>
                    <option th:each="r : ${databaseRoles}" th:value="${r.id}"
                            th:text="${r.name + ' (' + r.database.name + ')'}"
                            th:selected="${databaseRoleId == r.id}"></option>
                </select>
            </div>
        </div>

        <div class="form-buttons">
            <button type="submit" class="btn-add">Показати</button>
            <a th:href="@{/reports}" class="btn-cancel">Очистити</a>
            <a class="btn-export-excel"
               th:href="@{/reports/export(
                   departmentId=${departmentId},
                   onlyDepartmentSelected=${onlyDepartmentSelected},
                   databaseId=${databaseId},
                   databaseRoleId=${databaseRoleId},
                   certificateTypeId=${certificateTypeId},
                   expirationTo=${expirationTo}
               )}">
                Експорт в Excel
            </a>
        </div>
    </form>

    <div th:if="${report != null}">
        <h3>Результати</h3>
        <table class="list-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>ПІБ</th>
                <th>Підрозділ</th>
                <th>Активний</th>
                <th>Тип</th>
                <th>Деталі</th>
                <th>Дата закінчення</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${report}">
                <td th:text="${row.identificationNumber}"></td>
                <td><a th:href="@{/dbusers/edit/{id}(id=${row.userId})}"
                       th:text="${row.userName}"></a></td>
                <td th:text="${row.departmentName}"></td>
                <td th:text="${row.isActive ? 'Так' : 'Ні'}"></td>
                <td th:text="${row.source}"></td>
                <td>
                    <span th:if="${row.source == T(ua.com.userdb.dto.ReportSourceType).CERTIFICATE}"
                          th:text="${row.certificateTypeName}"></span>
                    <span th:if="${row.source == T(ua.com.userdb.dto.ReportSourceType).ACCESS}"
                          th:text="${row.databaseName + (row.databaseRoleName != null ? ' / ' + row.databaseRoleName : '')}"></span>
                </td>
                <td th:text="${row.expirationDate != null ? #temporals.format(row.expirationDate, 'yyyy-MM-dd') : ''}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Вбудований JavaScript для роботи фільтрів -->
    <script th:inline="javascript">
    (function() {
        const initFilterLogic = function() {
            const cert = document.getElementById('certificateTypeId');
            const db   = document.getElementById('databaseId');
            const role = document.getElementById('databaseRoleId');
            const form = document.getElementById('reportForm');

            if (!cert || !db || !role) return;

            function toggleFilters() {
                // Спочатку все розблоковуємо
                cert.disabled = false;
                db.disabled   = false;
                role.disabled = false;

                // Блокуємо решту, якщо вибрано конкретне значення
                if (cert.value && cert.value !== "") {
                    db.disabled = true;
                    role.disabled = true;
                } else if (db.value && db.value !== "") {
                    cert.disabled = true;
                    role.disabled = true;
                } else if (role.value && role.value !== "") {
                    cert.disabled = true;
                    db.disabled   = true;
                }
            }

            // Додаємо слухачі на миттєву зміну (change)
            cert.addEventListener('change', toggleFilters);
            db.addEventListener('change', toggleFilters);
            role.addEventListener('change', toggleFilters);

            // Викликаємо одразу для підтримки значень після перезавантаження (Thymeleaf)
            toggleFilters();

            // Перед відправкою форми (submit) розблокувати все, щоб Spring отримав дані
            if (form) {
                form.addEventListener('submit', function() {
                    cert.disabled = false;
                    db.disabled   = false;
                    role.disabled = false;
                });
            }
        };

        // Гарантований запуск після готовності DOM
        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initFilterLogic);
        } else {
            initFilterLogic();
        }
    })();
    </script>
</div>
</body>
</html>
