<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout}">
<head>
<title layout:fragment="title"
	th:text="${rank.id} == null ? 'Створити ранг' : 'Редагувати ранг'"></title>
<link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
	<div layout:fragment="content" class="form-container">

		<h2
			th:text="${rank.id} == null ? 'Створити звання' : 'Редагувати звання'"></h2>

		<form th:object="${rank}"
			th:action="@{${rank.id} == null ? '/ranks' : '/ranks/update/' + ${rank.id}}"
			method="post">

			<input type="hidden" th:field="*{id}" /> <label for="name">Назва:</label>
			<input type="text" id="name" th:field="*{name}" required /> <label>
				<input type="checkbox" th:field="*{isActive}" /> Активний
			</label>

			<div class="form-buttons">
				<button type="submit" class="btn-add">Зберегти</button>
				<a th:href="@{/ranks}" class="btn-cancel">Скасувати</a>
			</div>

		</form>

	</div>
</body>
</html>
