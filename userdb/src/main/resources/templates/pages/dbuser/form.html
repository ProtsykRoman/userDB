<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout}">
<head>
<title layout:fragment="title"
	th:text="${dbUser.id == null} ? 'Створити користувача бази даних' : 'Редагувати користувача бази даних'">
</title>
<link rel="stylesheet" th:href="@{/css/form-userDB.css}">
<link rel="icon" type="image/png" th:href="@{/favicon.png}">
</head>
<body>
	<div layout:fragment="content" class="form-container">

		<h2
			th:text="${dbUser.id == null} ? 'Створити користувача бази даних' : 'Редагувати користувача бази даних'"></h2>

		<div th:if="${error}" class="form-error">
			<p th:text="${error}"></p>
		</div>

		<form th:object="${dbUser}"
			th:action="${dbUser.id == null} ? @{/dbusers} : @{/dbusers/update/{id}(id=${dbUser.id})}"
			method="post">

			<input type="hidden" name="page" th:if="${currentPage != null}"
				th:value="${currentPage}" /> <input type="hidden" name="returnUrl"
				th:value="${returnUrl}" /> <input type="hidden" th:field="*{id}" />

			<!-- Перший рядок: ПІБ + Ідентифікаційний номер -->
			<div class="form-row">
				<div class="form-group">
					<label for="name">ПІБ:</label> <input type="text" id="name"
						th:field="*{name}" th:disabled="${readOnly == true}" required />
				</div>

				<div class="form-group" th:if="${readOnly != true}">
					<label for="identificationNumber">Ідентифікаційний номер:</label> <input
						type="number" id="identificationNumber"
						th:field="*{identificationNumber}" />
				</div>
			</div>

			<!-- Другий рядок: Ранг + Департамент -->
			<div class="form-row">
				<div class="form-group">
					<label for="rank">Звання:</label> <select id="rank"
						th:field="*{rank.id}" th:disabled="${readOnly == true}" required>

						<option value="" disabled th:selected="${dbUser.rank == null}">
							-- Виберіть звання --</option>

						<option th:each="r : ${ranks}" th:value="${r.id}"
							th:text="${r.name}"></option>

					</select> <label class="checkbox-inline"> <input type="checkbox"
						th:field="*{isActive}" th:disabled="${readOnly == true}" />
						Активний
					</label>
				</div>

				<div class="form-group">
					<label for="department">Підрозділ:</label> <select id="department"
						th:field="*{department.id}" th:disabled="${readOnly == true}"
						required>

						<option value="" disabled
							th:selected="${dbUser.department == null}"
							th:disabled="${readOnly == true}">--- Виберіть підрозділ
							---</option>

						<option th:each="dept : ${allDepartments}" th:value="${dept.id}"
							th:text="${'--'.repeat(dept.level) + dept.name}"></option>

					</select>
				</div>


			</div>

			<!-- Таблиця сертифікатів -->
			<div class="table-header">
				<h3>Сертифікати користувача</h3>
				<button type="button" class="btn-add" id="addCertBtn"
					th:if="${readOnly != true}">Додати</button>
			</div>
			<table id="certTable" class="data-table">
				<thead>
					<tr>
						<th>Тип сертифіката</th>
						<th>Номер</th>
						<th>Дата закінчення</th>
						<th>Заблоковано</th>
						<th th:if="${readOnly != true}">Дія</th>
					</tr>
				</thead>
				<tbody id="certBody">
					<tr th:each="cert, iStat : *{dbUserCertificates}">
						<td><input type="hidden"
							th:field="*{dbUserCertificates[__${iStat.index}__].id}" /> <select
							th:field="*{dbUserCertificates[__${iStat.index}__].certificateType.id}"
							th:disabled="${readOnly == true}" required>
								<option value="">-- Виберіть тип сертифіката --</option>
								<option th:each="c : ${certificateTypes}" th:value="${c.id}"
									th:text="${c.name}"
									th:selected="${cert.certificateType != null} ? ${c.id} == ${cert.certificateType.id} : false"></option>
						</select></td>
						<td><input type="text"
							th:field="*{dbUserCertificates[__${iStat.index}__].number}"
							th:disabled="${readOnly == true}" /></td>
						<td><input type="date"
							th:field="*{dbUserCertificates[__${iStat.index}__].expirationDate}"
							th:disabled="${readOnly == true}" /></td>
						<td><input type="checkbox"
							th:field="*{dbUserCertificates[__${iStat.index}__].blocked}"
							th:disabled="${readOnly == true}" /></td>

						<td class="action-cell" th:if="${readOnly != true}">
							<button type="button" class="btn-delete"
								onclick="removeCertRow(this)">Видалити</button>
						</td>
					</tr>
				</tbody>
			</table>

			<!-- Таблиця доступів -->
			<div class="table-header">
				<h3>Доступи до баз даних</h3>
				<button type="button" class="btn-add" id="addAccessBtn"
					th:if="${readOnly != true}">Додати</button>
			</div>
			<table id="accessTable" class="data-table">
				<thead>
					<tr>
						<th>База даних</th>
						<th>Дата завершення доступу</th>
						<th th:if="${readOnly != true}">Дія</th>
					</tr>
				</thead>
				<tbody id="accessBody">
					<tr th:each="access, iStat : *{dbUserAccesses}">
						<td><input type="hidden"
							th:field="*{dbUserAccesses[__${iStat.index}__].id}" /> <select
							th:field="*{dbUserAccesses[__${iStat.index}__].database.id}"
							th:disabled="${readOnly == true}" required>
								<option value="">-- Виберіть базу даних --</option>
								<option th:each="db : ${databases}" th:value="${db.id}"
									th:text="${db.name}"
									th:selected="${access.database != null} ? ${db.id} == ${access.database.id} : false"></option>
						</select></td>
						<td><input type="date"
							th:field="*{dbUserAccesses[__${iStat.index}__].accessExpirationDate}"
							th:disabled="${readOnly == true}" /></td>
						<td class="action-cell" th:if="${readOnly != true}">
							<button type="button" class="btn-delete"
								onclick="removeAccessRow(this)">Видалити</button>
						</td>
					</tr>
				</tbody>
			</table>

			<!-- Таблиця ролей -->
			<div class="table-header">
				<h3>Ролі користувача</h3>
				<button type="button" class="btn-add" id="addRoleBtn"
					th:if="${readOnly != true}">Додати</button>
			</div>
			<table id="roleTable" class="data-table">
				<thead>
					<tr>
						<th>Роль</th>
						<th th:if="${readOnly != true}">Дія</th>
					</tr>
				</thead>
				<tbody id="roleBody">
					<tr th:each="role, iStat : *{dbUserRoles}">
						<td><input type="hidden"
							th:field="*{dbUserRoles[__${iStat.index}__].id}" /> <select
							th:field="*{dbUserRoles[__${iStat.index}__].databaseRole.id}"
							th:disabled="${readOnly == true}" required>
								<option value="" th:disabled="${readOnly == true}">--
									Виберіть роль --</option>
								<option th:each="r : ${databaseRoles}" th:value="${r.id}"
									th:text="${r.name + ': (' + r.database.name + ')'}"
									th:selected="${role.databaseRole != null} ? ${r.id} == ${role.databaseRole.id} : false"></option>
						</select></td>
						<td class="action-cell" th:if="${readOnly != true}">
							<button type="button" class="btn-delete"
								onclick="removeRoleRow(this)">Видалити</button>
						</td>
					</tr>
				</tbody>
			</table>

			<div class="form-buttons">
				<button type="submit" class="btn-add" th:if="${readOnly != true}">Зберегти</button>
				<a th:if="${returnUrl != null}" th:href="${returnUrl}"
					class="btn-cancel">Скасувати</a> <a th:if="${returnUrl == null}"
					th:href="@{/dbusers(page=${currentPage})}" class="btn-cancel">Скасувати</a>
			</div>

		</form>
	</div>

	<div layout:fragment="scripts">
		<script th:inline="javascript">
			/*<![CDATA[*/
			const databases = JSON.parse(/*[[${databasesJson}]]*/'[]');
			const databaseRoles = JSON.parse(/*[[${databaseRolesJson}]]*/'[]');
			const certificateTypes = JSON
					.parse(/*[[${certificateTypesJson}]]*/'[]');
			/*]]>*/
		</script>

		<script th:src="@{/js/dbuser-form.js}"></script>
	</div>
</body>
</html>
