<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout}">
<head>
<title layout:fragment="title">Форма сертифіката</title>
<link rel="stylesheet" th:href="@{/css/forms.css}">
</head>
<body>
	<div layout:fragment="content" class="form-container">

		<h2
			th:text="${certificateType.id == 0 ? 'Додати сертифікат' : 'Редагувати сертифікат'}"></h2>

		<form th:action="@{/certificate-types}" th:object="${certificateType}"
			method="post">
			<input type="hidden" th:field="*{id}" />

			<div class="form-group">
				<label for="name">Назва:</label> <input type="text" id="name"
					th:field="*{name}" required /> <label class="checkbox-inline">
					<input type="checkbox" th:field="*{isActive}" /> Активний
				</label>
			</div>

			<div class="form-buttons">
				<button type="submit" class="btn-submit">Зберегти</button>
				<a th:href="@{/certificate-types}" class="btn-cancel">Скасувати</a>
			</div>
		</form>

	</div>
</body>
</html>
