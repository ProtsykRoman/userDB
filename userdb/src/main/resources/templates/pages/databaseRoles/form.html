<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title layout:fragment="title"
          th:text="${databaseRole.id == null}
              ? 'Створити роль бази даних'
              : 'Редагувати роль бази даних'">
    </title>

    <link rel="stylesheet" th:href="@{/css/forms.css}">
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
</head>

<body>
<div layout:fragment="content" class="form-container">

    <h2 th:text="${databaseRole.id == null}
            ? 'Створити роль бази даних'
            : 'Редагувати роль бази даних'">
    </h2>

    <div th:if="${error}" class="form-error">
        <p th:text="${error}"></p>
    </div>

    <form th:object="${databaseRole}"
          th:action="${databaseRole.id == null}
              ? @{/database-roles}
              : @{'/database-roles/update/' + ${databaseRole.id}}"
          method="post">

        <!-- id як у database.html -->
        <input type="hidden" th:field="*{id}" />

        <label for="name">Назва ролі:</label>
        <input type="text" id="name" th:field="*{name}" required />

        <label for="database">База даних:</label>
        <select id="database" th:field="*{database.id}" required>
            <option value="0">--- Виберіть базу даних ---</option>
            <option th:each="db : ${databases}"
                    th:value="${db.id}"
                    th:text="${db.name}">
            </option>
        </select>

        <label class="checkbox-inline">
            <input type="checkbox" th:field="*{isActive}" />
            Активний
        </label>

        <div class="form-buttons">
            <button type="submit" class="btn-add">Зберегти</button>
            <a th:href="@{/database-roles}" class="btn-cancel">Скасувати</a>
        </div>
    </form>

</div>
</body>
</html>
