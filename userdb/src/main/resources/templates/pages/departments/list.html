<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout}">
<head>
<title layout:fragment="title">Підрозділи</title>
<link rel="stylesheet" th:href="@{/css/lists.css}">
<link rel="icon" type="image/png" th:href="@{/favicon.png}">
</head>
<body>
	<div layout:fragment="content" class="list-container">

		<h2>Список підрозділів</h2>

		<!-- Кнопка додавання нового відділу -->
		<a class="btn-add" th:href="@{/departments/new}">+ Створити новий
			підрозділ</a>

		<table class="list-table">
			<thead>
				<tr>
					<th>ID</th>
					<th>Назва</th>
					<th>Батьківський підрозділ</th>
					<th>Активний</th>
					<th>Дії</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="dept : ${departments}">
					<td th:text="${dept.id}"></td>
					<td th:text="${dept.name}"></td>
					<td th:text="${dept.parent != null ? dept.parent.name : '---'}"></td>
					<td th:text="${dept.isActive} ? 'Так' : 'Ні'"></td>
					<td class="table-actions"><a
						th:href="@{'/departments/edit/' + ${dept.id}}" class="btn-edit">Редагувати</a>
					</td>
				</tr>
			</tbody>
		</table>
		<div class="pagination">
			<span
				th:text="'Записи ' + (${currentPage}-1)*${pageSize}+1 + ' - ' +
        ((${currentPage}-1)*${pageSize} + ${departments.size()}) +
        ' з ' + ${totalRecords}">
			</span>

			<div class="pagination-buttons">
				<a th:if="${currentPage > 1}"
					th:href="@{/departments(page=${currentPage - 1}, size=${pageSize})}">
					&laquo; Назад </a> <a th:if="${currentPage < totalPages}"
					th:href="@{/departments(page=${currentPage + 1}, size=${pageSize})}">
					Вперед &raquo; </a>
			</div>
		</div>

	</div>
</body>
</html>
