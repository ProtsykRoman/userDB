<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список підрозділів</title>
</head>
<body>

<h1>Підрозділи</h1>

<a th:href="@{/departments/new}">➕ Додати підрозділ</a>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Назва</th>
        <th>Батьківський підрозділ</th>
        <th>Дії</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="dep : ${departments}">
        <td th:text="${dep.id}"></td>
        <td th:text="${dep.name}"></td>
        <td th:text="${dep.parent != null ? dep.parent.name : '-'}"></td>
        <td>
            <a th:href="@{'/departments/edit/' + ${dep.id}}">✏️ Редагувати</a> |
            <a th:href="@{'/departments/delete/' + ${dep.id}}"
               onclick="return confirm('Видалити цей підрозділ?');">🗑️ Видалити</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
