<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редагувати підрозділ</title>
</head>
<body>

<h1>Редагувати підрозділ</h1>

<form th:action="@{'/departments/update/' + ${department.id}}" th:object="${department}" method="post">

    <input type="hidden" th:field="*{id}">

    <label for="name">Назва:</label>
    <input type="text" id="name" th:field="*{name}" required>
    <br><br>

    <label for="parent">Батьківський підрозділ:</label>
    <select id="parent" th:field="*{parent}">
        <option th:value="">-- немає (верхній рівень) --</option>
        <option th:each="p : ${departments}" th:value="${p.id}"
                th:text="${p.name}"
                th:selected="${p.id == department.parent?.id}"></option>
    </select>
    <br><br>

    <button type="submit">💾 Оновити</button>
    <a th:href="@{/departments}">↩ Назад</a>
</form>

</body>
</html>
