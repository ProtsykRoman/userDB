<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редагувати доступ користувача</title>
</head>
<body>

<h1>Редагувати доступ користувача</h1>

<form th:action="@{'/dbUserAccess/update/' + ${dbUserAccess.id}}" th:object="${dbUserAccess}" method="post">
    <input type="hidden" th:field="*{id}">

    <label for="dbUser">Користувач:</label>
    <select id="dbUser" th:field="*{dbUser}">
        <option th:value="">-- вибрати користувача --</option>
        <option th:each="u : ${dbUsers}" th:value="${u.id}" 
                th:text="${u.name}" 
                th:selected="${u.id == dbUserAccess.dbUser?.id}"></option>
    </select>
    <br><br>

    <label for="database">База даних:</label>
    <select id="database" th:field="*{database}">
        <option th:value="">-- вибрати базу даних --</option>
        <option th:each="db : ${databases}" th:value="${db.id}" 
                th:text="${db.name}" 
                th:selected="${db.id == dbUserAccess.database?.id}"></option>
    </select>
    <br><br>

    <label for="accessExpirationDate">Дата закінчення доступу:</label>
    <input type="date" id="accessExpirationDate" th:field="*{accessExpirationDate}" required>
    <br><br>

    <button type="submit">💾 Оновити</button>
    <a th:href="@{/dbUserAccess}">↩ Назад</a>
</form>

</body>
</html>
