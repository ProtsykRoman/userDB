<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редагувати роль користувача</title>
</head>
<body>

<h1>Редагувати роль користувача бази даних</h1>

<form th:action="@{'/dbUserRoles/update/' + ${dbUserRole.id}}" th:object="${dbUserRole}" method="post">

    <input type="hidden" th:field="*{id}">

    <label for="dbUser">Користувач:</label>
    <select id="dbUser" th:field="*{dbUser}">
        <option th:value="">-- вибрати користувача --</option>
        <option th:each="u : ${dbUsers}" th:value="${u.id}"
                th:text="${u.name}"
                th:selected="${u.id == dbUserRole.dbUser?.id}"></option>
    </select>
    <br><br>

    <label for="databaseRole">Роль бази даних:</label>
    <select id="databaseRole" th:field="*{databaseRole}">
        <option th:value="">-- вибрати роль --</option>
        <option th:each="r : ${databaseRoles}" th:value="${r.id}"
                th:text="${r.name + ' (' + (r.database != null ? r.database.name : '-') + ')'}"
                th:selected="${r.id == dbUserRole.databaseRole?.id}"></option>
    </select>
    <br><br>

    <button type="submit">💾 Оновити</button>
    <a th:href="@{/dbUserRoles}">↩ Назад</a>
</form>

</body>
</html>
