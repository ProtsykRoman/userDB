<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Створити користувача</title>
</head>
<body>

<h1>Створити нового користувача</h1>

<form th:action="@{/users}" th:object="${user}" method="post">

    <label for="username">Ім’я користувача:</label>
    <input type="text" id="username" th:field="*{username}" placeholder="username" required>
    <br><br>

    <label for="password">Пароль:</label>
    <input type="password" id="password" th:field="*{password}" required>
    <br><br>

    <label for="role">Роль:</label>
    <input type="text" id="role" th:field="*{role}" placeholder="ROLE_USER / ROLE_ADMIN" required>
    <br><br>

    <label for="isActive">Активний:</label>
    <input type="checkbox" id="isActive" th:field="*{isActive}">
    <br><br>

    <label for="department">Підрозділ:</label>
    <select id="department" th:field="*{department}">
        <option th:value="">-- вибрати підрозділ --</option>
        <option th:each="dep : ${departments}" th:value="${dep.id}" th:text="${dep.name}"></option>
    </select>
    <br><br>

    <button type="submit">💾 Зберегти</button>
    <a th:href="@{/users}">↩ Назад</a>

</form>

</body>
</html>
