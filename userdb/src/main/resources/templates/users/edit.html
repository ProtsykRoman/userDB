<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редагувати користувача</title>
</head>
<body>

<h1>Редагувати користувача</h1>

<form th:action="@{'/users/update/' + ${user.id}}" th:object="${user}" method="post">

    <input type="hidden" th:field="*{id}">

    <label for="username">Ім’я користувача:</label>
    <input type="text" id="username" th:field="*{username}" required>
    <br><br>

    <label for="password">Пароль:</label>
    <input type="password" id="password" th:field="*{password}" placeholder="••••••••">
    <br><br>

    <label for="role">Роль:</label>
    <input type="text" id="role" th:field="*{role}" required>
    <br><br>

    <label for="isActive">Активний:</label>
    <input type="checkbox" id="isActive" th:field="*{isActive}">
    <br><br>

    <label for="department">Підрозділ:</label>
    <select id="department" th:field="*{department}">
        <option th:value="">-- вибрати підрозділ --</option>
        <option th:each="dep : ${departments}" th:value="${dep.id}"
                th:text="${dep.name}"
                th:selected="${dep.id == user.department?.id}"></option>
    </select>
    <br><br>

    <button type="submit">💾 Оновити</button>
    <a th:href="@{/users}">↩ Назад</a>

</form>

</body>
</html>
