<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список користувачів</title>
</head>
<body>

<h1>Користувачі</h1>

<a th:href="@{/users/new}">➕ Додати користувача</a>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Ім’я користувача</th>
        <th>Роль</th>
        <th>Активний</th>
        <th>Підрозділ</th>
        <th>Дії</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.username}"></td>
        <td th:text="${user.role}"></td>
        <td th:text="${user.isActive} ? '✅ Так' : '❌ Ні'"></td>
        <td th:text="${user.department != null ? user.department.name : '-'}"></td>
        <td>
            <a th:href="@{'/users/edit/' + ${user.id}}">✏️ Редагувати</a> |
            <a th:href="@{'/users/delete/' + ${user.id}}"
               onclick="return confirm('Видалити цього користувача?');">🗑️ Видалити</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
