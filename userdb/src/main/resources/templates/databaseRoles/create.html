<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Створити роль бази даних</title>
</head>
<body>

<h1>Створити нову роль</h1>

<form th:action="@{/databaseRoles}" th:object="${databaseRole}" method="post">
    <label for="name">Назва:</label>
    <input type="text" id="name" th:field="*{name}" placeholder="Введіть назву" required>
    <br><br>

    <label for="database">База даних:</label>
    <select id="database" th:field="*{database}">
        <option th:value="">-- вибрати базу --</option>
        <option th:each="db : ${databases}" th:value="${db.id}" th:text="${db.name}"></option>
    </select>
    <br><br>

    <button type="submit">💾 Зберегти</button>
    <a th:href="@{/databaseRoles}">↩ Назад</a>
</form>

</body>
</html>
