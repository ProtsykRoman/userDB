<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Створити базу даних</title>
</head>
<body>

<h1>Створити нову базу даних</h1>

<form th:action="@{/databases}" th:object="${database}" method="post">
    <label for="name">Назва:</label>
    <input type="text" id="name" th:field="*{name}" placeholder="Введіть назву" required>
    <br><br>

    <label for="parentDatabase">Батьківська база:</label>
    <select id="parentDatabase" th:field="*{parentDatabase}">
        <option th:value="">-- немає --</option>
        <option th:each="db : ${databases}" th:value="${db.id}" th:text="${db.name}"></option>
    </select>
    <br><br>

    <button type="submit">💾 Зберегти</button>
    <a th:href="@{/databases}">↩ Назад</a>
</form>

</body>
</html>
