<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редагувати базу даних</title>
</head>
<body>

<h1>Редагувати базу даних</h1>

<form th:action="@{'/databases/update/' + ${database.id}}" th:object="${database}" method="post">
    <input type="hidden" th:field="*{id}">

    <label for="name">Назва:</label>
    <input type="text" id="name" th:field="*{name}" required>
    <br><br>

    <label for="parentDatabase">Батьківська база:</label>
    <select id="parentDatabase" th:field="*{parentDatabase}">
        <option th:value="">-- немає --</option>
        <option th:each="db : ${databases}" th:value="${db.id}" 
                th:text="${db.name}" 
                th:selected="${db.id == database.parentDatabase?.id}"></option>
    </select>
    <br><br>

    <button type="submit">💾 Оновити</button>
    <a th:href="@{/databases}">↩ Назад</a>
</form>

</body>
</html>
