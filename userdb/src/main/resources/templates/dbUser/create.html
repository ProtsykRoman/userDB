<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Створити користувача бази даних</title>
</head>
<body>

<h1>Створити нового користувача бази даних</h1>

<form th:action="@{/dbUsers}" th:object="${dbUser}" method="post">

    <label for="name">Ім’я:</label>
    <input type="text" id="name" th:field="*{name}" placeholder="Введіть ім’я" required>
    <br><br>

    <label for="rank">Звання:</label>
    <select id="rank" th:field="*{rank}">
        <option th:value="">-- вибрати звання --</option>
        <option th:each="r : ${ranks}" th:value="${r.id}" th:text="${r.name}"></option>
    </select>
    <br><br>

    <label for="department">Підрозділ:</label>
    <select id="department" th:field="*{department}">
        <option th:value="">-- вибрати підрозділ --</option>
        <option th:each="d : ${departments}" th:value="${d.id}" th:text="${d.name}"></option>
    </select>
    <br><br>

    <label for="identificationNumber">Ідентифікаційний номер:</label>
    <input type="number" id="identificationNumber" th:field="*{identificationNumber}" required>
    <br><br>

    <button type="submit">💾 Зберегти</button>
    <a th:href="@{/dbUsers}">↩ Назад</a>
</form>

</body>
</html>
