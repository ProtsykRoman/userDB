<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Авторизація</title>
<link rel="stylesheet" th:href="@{/css/login.css}">
<link rel="icon" type="image/png" th:href="@{/favicon.png}">
</head>
<body>
	<div class="login-container">
		<div class="login-box">
			<h2>Вхід у систему</h2>
			<form th:action="@{/login}" method="post">
				<div class="textbox">
					<input type="text" name="username" placeholder="Логін" required>
				</div>

				<div class="textbox password-wrapper">
					<input type="password" name="password" id="password"
						placeholder="Пароль" required> <span
						class="toggle-password" onclick="togglePassword()"> <svg
							id="eyeIcon" viewBox="0 0 24 24" fill="none"
							stroke="currentColor" stroke-width="2" stroke-linecap="round"
							stroke-linejoin="round">
                            <path
								d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
					</span>
				</div>

				<button type="submit" class="btn">Увійти</button>

				<div th:if="${param.error}" class="error-message">Некоректний
					логін або пароль</div>
				<div th:if="${param.logout}" class="success-message">Ви вийшли
					із системи</div>
			</form>
		</div>
	</div>

	<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                
                eyeIcon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                `;
            } else {
                passwordInput.type = 'password';
                
                eyeIcon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }
    </script>
</body>
</html>
