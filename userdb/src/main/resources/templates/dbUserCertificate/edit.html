<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редагувати сертифікат користувача</title>
</head>
<body>

<h1>Редагувати сертифікат користувача</h1>

<form th:action="@{'/dbUserCertificates/update/' + ${dbUserCertificate.id}}" 
      th:object="${dbUserCertificate}" method="post">

    <input type="hidden" th:field="*{id}">

    <label for="dbUser">Користувач:</label>
    <select id="dbUser" th:field="*{dbUser}">
        <option th:value="">-- вибрати користувача --</option>
        <option th:each="u : ${dbUsers}" th:value="${u.id}" 
                th:text="${u.name}" 
                th:selected="${u.id == dbUserCertificate.dbUser?.id}"></option>
    </select>
    <br><br>

    <label for="certificateType">Тип сертифікату:</label>
    <select id="certificateType" th:field="*{certificateType}">
        <option th:value="">-- вибрати тип сертифікату --</option>
        <option th:each="t : ${certificateTypes}" th:value="${t.id}" 
                th:text="${t.name}" 
                th:selected="${t.id == dbUserCertificate.certificateType?.id}"></option>
    </select>
    <br><br>

    <label for="number">Номер сертифікату:</label>
    <input type="text" id="number" th:field="*{number}" required>
    <br><br>

    <label for="expirationDate">Дата закінчення дії:</label>
    <input type="date" id="expirationDate" th:field="*{expirationDate}" required>
    <br><br>

    <label for="isBlocked">Заблоковано:</label>
    <input type="checkbox" id="isBlocked" th:field="*{isBlocked}">
    <br><br>

    <button type="submit">💾 Оновити</button>
    <a th:href="@{/dbUserCertificates}">↩ Назад</a>
</form>

</body>
</html>
