<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список сертифікатів користувачів</title>
</head>
<body>

<h1>Сертифікати користувачів</h1>

<a th:href="@{/dbUserCertificates/new}">➕ Додати сертифікат</a>

<table border="1" cellpadding="8" cellspacing="0">
    <thead>
    <tr>
        <th>ID</th>
        <th>Користувач</th>
        <th>Тип сертифікату</th>
        <th>Номер</th>
        <th>Дата закінчення</th>
        <th>Заблоковано</th>
        <th>Дії</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="cert : ${dbUserCertificates}">
        <td th:text="${cert.id}"></td>
        <td th:text="${cert.dbUser != null ? cert.dbUser.name : '-'}"></td>
        <td th:text="${cert.certificateType != null ? cert.certificateType.name : '-'}"></td>
        <td th:text="${cert.number}"></td>
        <td th:text="${#dates.format(cert.expirationDate, 'yyyy-MM-dd')}"></td>
        <td th:text="${cert.isBlocked ? 'Так' : 'Ні'}"></td>
        <td>
            <a th:href="@{'/dbUserCertificates/edit/' + ${cert.id}}">✏️ Редагувати</a> |
            <a th:href="@{'/dbUserCertificates/delete/' + ${cert.id}}"
               onclick="return confirm('Видалити сертифікат?');">🗑️ Видалити</a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
