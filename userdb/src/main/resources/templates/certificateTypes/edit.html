<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Редагувати тип сертифікату</title>
</head>
<body>

<h1>Редагувати тип сертифікату</h1>

<form th:action="@{'/certificate-types/update/' + ${certificateType.id}}" 
      th:object="${certificateType}" method="post">
    <input type="hidden" th:field="*{id}">

    <label for="name">Назва:</label>
    <input type="text" id="name" th:field="*{name}" required>
    <br><br>

    <button type="submit">💾 Оновити</button>
    <a th:href="@{/certificate-types}">↩ Назад</a>
</form>

</body>
</html>
