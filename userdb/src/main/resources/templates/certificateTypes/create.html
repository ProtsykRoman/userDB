<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Створити тип сертифікату</title>
</head>
<body>

<h1>Створити новий тип сертифікату</h1>

<form th:action="@{/certificate-types}" th:object="${certificateType}" method="post">
    <label for="name">Назва:</label>
    <input type="text" id="name" th:field="*{name}" placeholder="Введіть назву" required>
    <br><br>
    <button type="submit">💾 Зберегти</button>
    <a th:href="@{/certificate-types}">↩ Назад</a>
</form>

</body>
</html>
